spring:
  application:
    name: vistay-warehouse-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vistay_warehouse_db}
    username: ${DB_USERNAME:vistay}
    password: ${DB_PASSWORD:vistay}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD:}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      properties:
        isolation.level: read_committed

vistay:
  topics:
    booking-events: ${BOOKING_EVENTS_TOPIC:vistay.booking.events}
    payment-confirmed: ${PAYMENT_CONFIRMED_TOPIC:vistay.payment.transaction-confirmed.v1}
    revenue-recognition: ${REVENUE_RECOGNITION_TOPIC:vistay.finance.revenue-recognized.v1}
    expense-events: ${EXPENSE_EVENTS_TOPIC:vistay.finance.expense-approved.v1}
  kafka:
    consumers:
      booking:
        group-id: ${KAFKA_CONSUMER_GROUP_BOOKING:warehouse-booking-consumer}
      payment:
        group-id: ${KAFKA_CONSUMER_GROUP_PAYMENT:warehouse-payment-consumer}
      revenue:
        group-id: ${KAFKA_CONSUMER_GROUP_REVENUE:warehouse-revenue-consumer}
      revenue-recognition:
        enabled: false
      expense:
        group-id: ${KAFKA_CONSUMER_GROUP_EXPENSE:warehouse-expense-consumer}
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: logstash
